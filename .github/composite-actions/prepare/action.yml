name: Prepare
description: Prepares the repo for a typical CI job

runs:
  using: composite
  steps:
    # Installs pnpm (version from the packageManager field) and the Node.js
    # runtime from devEngines.runtime, then runs the install — no separate
    # actions/setup-node step. cache: true caches the pnpm store and the
    # lockfile verification result, which matters here because
    # minimumReleaseAge makes an uncached verification hit the registry for
    # every entry. require-lockfile fails the job if pnpm-lock.yaml does not
    # already describe the install, rather than resolving fresh versions.
    #
    # pnpm blocks install scripts by default; only the allowBuilds allowlist
    # in pnpm-workspace.yaml runs, matching the Dockerfile.
    - name: Set up pnpm, Node.js and install dependencies
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: true
        require-lockfile: true

    # Persist Turbo's local cache across runs so unchanged tasks replay
    # instead of re-executing. Scoped per job (github.job) so the parallel
    # code-quality jobs don't clobber each other's task outputs; the sha
    # suffix keeps keys write-unique, and restore-keys falls back to the
    # newest prior cache for this job — which GitHub already prefers from
    # the same branch/PR, then the base branch.
    - name: Cache Turbo local artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    # Apps read their env at build/test time via Vite; the example values
    # are enough for CI. Fails loudly if a cp fails.
    - name: Copy env files
      shell: bash
      run: |
        shopt -s nullglob
        for f in apps/*/.env.example; do cp "$f" "${f%.env.example}.env"; done

    # Exports TURBO_SCM_BASE / TURBO_SCM_HEAD, so any subsequent
    # `turbo --affected` invocation diffs against the right range.
    - name: Resolve SCM range
      uses: ./.github/composite-actions/resolve-scm-range
