name: Turbo cache summary
description: Writes the latest Turbo run's cache hit/miss breakdown to the job summary

runs:
  using: composite
  steps:
    - name: Write Turbo cache summary
      shell: bash
      env:
        JOB: ${{ github.job }}
      run: |
        set -euo pipefail

        # Newest run summary produced by `turbo run ... --summarize`. Each job
        # clears .turbo/runs before running, so at most one file exists here.
        f=$(ls -t .turbo/runs/*.json 2>/dev/null | head -n1 || true)

        if [[ -z "${f}" ]]; then
          body="_No Turbo run summary found._"
        else
          attempted=$(jq '.execution.attempted' "${f}")
          cached=$(jq '.execution.cached' "${f}")
          if [[ "${attempted}" -eq 0 ]]; then
            body="_No affected tasks — nothing to run._"
          elif [[ "${cached}" -eq 0 ]]; then
            body="_Cache not used — 0 of ${attempted} tasks were cached._"
          else
            saved_s=$(jq '([.tasks[].cache.timeSaved // 0] | add // 0) / 1000 | round' "${f}")
            body="**Cache used:** ${cached}/${attempted} tasks served from cache, ~${saved_s}s saved."
          fi
        fi

        printf '### Turbo cache — %s\n\n%s\n' "${JOB}" "${body}" >> "$GITHUB_STEP_SUMMARY"
